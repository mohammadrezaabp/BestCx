# Used only by scripts/ci-stack.py against a fresh, disposable BestCx installation.
services:
  cx-platform:
    environment:
      CX_Auth__Mode: apikey
      CX_Auth__ApiKeys__0__Key: ${CX_E2E_PRODUCER_KEY:?Generated by ci-stack.py}
      CX_Auth__ApiKeys__0__Subject: ci-producer
      CX_Auth__ApiKeys__0__TenantId: bestcx
      CX_Auth__ApiKeys__0__Roles__0: producer
      CX_Auth__ApiKeys__1__Key: ${CX_E2E_ADMIN_KEY:?Generated by ci-stack.py}
      CX_Auth__ApiKeys__1__Subject: ci-admin
      CX_Auth__ApiKeys__1__TenantId: bestcx
      CX_Auth__ApiKeys__1__Roles__0: admin
      CX_Ai__Enabled: "true"
      CX_Ai__ApiKey: ""
      CX_Voice__Stt__Engine: stub
