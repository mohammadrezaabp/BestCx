limit_req_zone $binary_remote_addr zone=portal:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=portal_voice:10m rate=6r/m;
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Voice messages: up to ~5 minutes of 16 kHz WAV (the platform enforces 10 MB).
    location = /v1/portal/voice {
        client_max_body_size 11m;
        limit_req zone=portal_voice burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://cx-platform:8080;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header X-Api-Key "";
    }
    location /v1/portal/ {
        limit_req zone=portal burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://cx-platform:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header X-Api-Key "";
    }
    location /v1/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
