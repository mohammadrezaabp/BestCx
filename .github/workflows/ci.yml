name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check-release.py
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CX_TEST_REQUIRE_DEPENDENCIES: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: dotnet test tests/Cx.UnitTests/Cx.UnitTests.csproj -c Release --logger trx --results-directory artifacts/unit
      - run: dotnet test tests/Cx.ContractTests/Cx.ContractTests.csproj -c Release --logger trx --results-directory artifacts/contract
      - run: dotnet test tests/Cx.IntegrationTests/Cx.IntegrationTests.csproj -c Release --logger trx --results-directory artifacts/integration
      - run: python scripts/check-test-results.py artifacts
      - run: dotnet publish src/Cx.Host/Cx.Host.csproj -c Release -o /tmp/bestcx-publish
  interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [Cx.Web, Cx.CustomerPortal]
    defaults:
      run:
        working-directory: src/${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --only-shell chromium
      - run: npm test
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release-policy, server, interfaces]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - run: python scripts/ci-stack.py
