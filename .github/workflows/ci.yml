name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check-release.py
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - run: dotnet test tests/Cx.UnitTests/Cx.UnitTests.csproj -c Release
      - run: dotnet test tests/Cx.ContractTests/Cx.ContractTests.csproj -c Release
      - run: dotnet publish src/Cx.Host/Cx.Host.csproj -c Release -o /tmp/bestcx-publish
  interfaces:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Cx.Web, Cx.CustomerPortal]
    defaults:
      run:
        working-directory: src/${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
